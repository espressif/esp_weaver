---
# CI for esp_weaver (HACS, hassfest, lint, tests).
# https://developers.home-assistant.io/docs/creating_integration_manifest

name: CI

on:
  push:
    # The GitLab mirror pushes master and release/v* (see .gitlab-ci.yml);
    # the branch names here have to match or nothing ever runs on GitHub.
    branches: [master, main, "release/v*"]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.13"

jobs:
  hacs-validate:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # HACS also checks the GitHub repository itself: it must have a
      # description and topics, and issues must be enabled. `brands` asks
      # for the domain to be in home-assistant/brands; drop the ignore once
      # it is.
      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  hassfest-validate:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hassfest Validation
        uses: home-assistant/actions/hassfest@master

  ruff-lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep -E '^ruff==' requirements_test.txt)"

      - name: Ruff check
        run: ruff check custom_components/esp_weaver tests

  ruff-format:
    name: Ruff Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep -E '^ruff==' requirements_test.txt)"

      - name: Ruff format check
        run: ruff format --check custom_components/esp_weaver tests

  codespell:
    name: Codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install codespell
        run: pip install "$(grep -E '^codespell==' requirements_test.txt)"

      # Configured by .codespellrc; scans the whole checkout.
      - name: Run codespell
        run: codespell

  yamllint:
    name: Yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install yamllint
        run: pip install "$(grep -E '^yamllint==' requirements_test.txt)"

      - name: Run yamllint
        run: |
          yamllint .gitlab-ci.yml .github \
            custom_components/esp_weaver/quality_scale.yaml \
            custom_components/esp_weaver/device_profiles

  profiles:
    name: Profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      # Duplicate entity keys per device type fail (tools/check_profile_keys.py).
      # The shipped profiles and the profile code copies are not compared
      # with esp-weaver-profiles here: the repositories merge independently,
      # and maintainers run tools/check_shipped_profiles.py and
      # tools/check_profile_code_sync.py by hand against a local checkout.
      - name: Check profile keys
        run: python tools/check_profile_keys.py

  mypy:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run mypy
        run: mypy custom_components/esp_weaver tests --config-file=pyproject.toml

  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run pylint
        run: pylint custom_components/esp_weaver --rcfile=pyproject.toml

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=custom_components/esp_weaver \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=95 \
            --junitxml=report.xml \
            --durations=10 \
            -v

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage.xml
            htmlcov/
            report.xml
          retention-days: 30

  # hacs.json declares 2025.12.5; this job pins pytest-homeassistant-custom-component
  # 0.13.301 (2025.12.4), the last plugin on the 2025.12 line—2025.12.5 had no
  # matching plugin release.
  pytest-minimum:
    name: Pytest on minimum Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies for the minimum supported release
        run: |
          python -m pip install --upgrade pip
          sed -E 's/^pytest-homeassistant-custom-component==.*/pytest-homeassistant-custom-component==0.13.301/' \
            requirements_test.txt > requirements_test_minimum.txt
          pip install -r requirements_test_minimum.txt
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"

      - name: Run pytest
        run: pytest tests/ -q

  pytest-config-flow:
    name: Config Flow 100% Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run config flow tests with 100% coverage
        run: |
          pytest tests/ -k config_flow \
            --cov=custom_components.esp_weaver.config_flow \
            --cov=custom_components.esp_weaver.flows \
            --cov-report=term-missing \
            --cov-fail-under=100 \
            -v

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - hacs-validate
      - hassfest-validate
      - ruff-lint
      - ruff-format
      - codespell
      - yamllint
      - mypy
      - pylint
      - profiles
      - pytest
      - pytest-minimum
      - pytest-config-flow
    steps:
      - name: All checks passed
        run: |
          echo "All mandatory quality checks passed"
          echo "Code coverage meets the 95% threshold"
