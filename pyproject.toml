# =============================================================================
# ESP-Weaver pyproject.toml
# Aligned with Home Assistant Core standards for future Core submission
# Reference: https://github.com/home-assistant/core/blob/dev/pyproject.toml
# =============================================================================

[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "esp_weaver"
version = "0.0.1"
description = "ESP Local Control integration for Home Assistant"
requires-python = ">=3.13.2"
license = {text = "Apache-2.0"}
authors = [
    {name = "Espressif Systems", email = "developer@espressif.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-homeassistant-custom-component>=0.13.301",
    "ruff>=0.13.0",
    "mypy>=1.10.0",
]

# =============================================================================
# Pytest Configuration (aligned with HA Core)
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring real devices",
]

# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
source = ["custom_components/esp_weaver"]
omit = [
    # Third-party: ESP Local Control protocol implementation
    # NOTE: For HA Core submission, extract to separate PyPI package
    "custom_components/esp_weaver/iot/local_ctrl/*",
]

[tool.coverage.report]
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == \"__main__\":",
    "raise NotImplementedError",
    "@abstractmethod",
]

# =============================================================================
# Ruff Configuration (aligned with HA Core)
# Reference: https://github.com/home-assistant/core/blob/dev/pyproject.toml
# =============================================================================

[tool.ruff]
required-version = ">=0.13.0"
# Exclude third-party ESP Local Control protocol implementation
exclude = ["custom_components/esp_weaver/iot/local_ctrl"]

[tool.ruff.lint]
select = [
    # ----- Exactly as HA Core -----
    "A001",   # Variable {name} is shadowing a Python builtin
    "ASYNC",  # flake8-async
    "B002",   # Python does not support the unary prefix increment
    "B005",   # Using .strip() with multi-character strings is misleading
    "B007",   # Loop control variable {name} not used within loop body
    "B009",   # Do not call getattr with a constant attribute value
    "B014",   # Exception handler with duplicate exception
    "B015",   # Pointless comparison
    "B017",   # pytest.raises(BaseException) should be considered evil
    "B018",   # Found useless attribute access
    "B023",   # Function definition does not bind loop variable {name}
    "B024",   # `{name}` is an abstract base class, but it has no abstract methods or properties
    "B026",   # Star-arg unpacking after a keyword argument is strongly discouraged
    "B032",   # Possible unintentional type annotation (using :)
    "B035",   # Dictionary comprehension uses static key
    "B904",   # Use raise from to specify exception cause
    "B905",   # zip() without an explicit strict= parameter
    "BLE",
    "C",      # complexity
    "COM818", # Trailing comma on bare tuple prohibited
    "D",      # docstrings
    "DTZ003", # Use datetime.now(tz=) instead of datetime.utcnow()
    "DTZ004", # Use datetime.fromtimestamp(ts, tz=) instead of datetime.utcfromtimestamp(ts)
    "E",      # pycodestyle
    "F",      # pyflakes/autoflake
    "F541",   # f-string without any placeholders
    "FLY",    # flynt
    "FURB",   # refurb
    "G",      # flake8-logging-format
    "I",      # isort
    "INP",    # flake8-no-pep420
    "ISC",    # flake8-implicit-str-concat
    "ICN001", # import conventions
    "LOG",    # flake8-logging
    "N804",   # First argument of a class method should be named cls
    "N805",   # First argument of a method should be named self
    "N815",   # Variable {name} in class scope should not be mixedCase
    "PERF",   # Perflint
    "PGH",    # pygrep-hooks
    "PIE",    # flake8-pie
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-pathlib
    "PYI",    # flake8-pyi
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF005", # Consider iterable unpacking instead of concatenation
    "RUF006", # Store a reference to the return value of asyncio.create_task
    "RUF007", # Prefer itertools.pairwise() over zip()
    "RUF008", # Do not use mutable default values for dataclass attributes
    "RUF010", # Use explicit conversion flag
    "RUF013", # PEP 484 prohibits implicit Optional
    "RUF016", # Slice in indexed access uses wrong type
    "RUF017", # Avoid quadratic list summation
    "RUF018", # Avoid assignment expressions in assert statements
    "RUF019", # Unnecessary key check before dictionary access
    "RUF020", # {never_like} | T is equivalent to T
    "RUF021", # Parenthesize a and b expressions when chaining
    "RUF022", # Sort __all__
    "RUF023", # Sort __slots__
    "RUF024", # Do not pass mutable objects as values to dict.fromkeys
    "RUF026", # default_factory is a positional-only argument to defaultdict
    "RUF030", # print() call in assert statement
    "RUF032", # Decimal() called with float literal argument
    "RUF033", # __post_init__ method with argument defaults
    "RUF034", # Useless if-else condition
    "RUF059", # unused-unpacked-variable
    "RUF100", # Unused `noqa` directive
    "RUF101", # noqa directives that use redirected rule codes
    "RUF200", # Failed to parse pyproject.toml
    "S102",   # Use of exec detected
    "S103",   # bad-file-permissions
    "S108",   # hardcoded-temp-file
    "S306",   # suspicious-mktemp-usage
    "S307",   # suspicious-eval-usage
    "S313",   # suspicious-xmlc-element-tree-usage
    "S314",   # suspicious-xml-element-tree-usage
    "S315",   # suspicious-xml-expat-reader-usage
    "S316",   # suspicious-xml-expat-builder-usage
    "S317",   # suspicious-xml-sax-usage
    "S318",   # suspicious-xml-mini-dom-usage
    "S319",   # suspicious-xml-pull-dom-usage
    "S601",   # paramiko-call
    "S602",   # subprocess-popen-with-shell-equals-true
    "S604",   # call-with-shell-equals-true
    "S608",   # hardcoded-sql-expression
    "S609",   # unix-command-wildcard-injection
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "T100",   # Trace found: {name} used
    "T20",    # flake8-print
    "TC",     # flake8-type-checking
    "TID",    # Tidy imports
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "UP031",  # Use format specifiers instead of percent format
    "UP032",  # Use f-string instead of `format` call
    "W",      # pycodestyle
]

ignore = [
    # ----- Exactly as HA Core -----
    "ASYNC109", # Async function definition with a `timeout` parameter
    "ASYNC110", # Use `asyncio.Event` instead of awaiting `asyncio.sleep` in a `while` loop
    "D202",     # No blank lines allowed after function docstring
    "D203",     # 1 blank line required before class docstring
    "D213",     # Multi-line docstring summary should start at the second line
    "D406",     # Section name should end with a newline
    "D407",     # Section name underlining
    "D417",     # Missing argument descriptions in docstring
    "E501",     # line too long

    "PLC1901", # can be simplified as an empty string is falsey
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments to function call
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "PLW1641", # __eq__ without __hash__
    "PLW2901", # Outer variable overwritten by inner target
    "PT011",   # pytest.raises is too broad
    "PT018",   # Assertion should be broken down into multiple parts
    "RUF001",  # String contains ambiguous unicode character
    "RUF002",  # Docstring contains ambiguous unicode character
    "RUF003",  # Comment contains ambiguous unicode character
    "RUF015",  # Prefer next(...) over single element slice
    "SIM102",  # Use a single if statement instead of nested if statements
    "SIM103",  # Return the condition directly
    "SIM108",  # Use ternary operator instead of if-else-block
    "SIM115",  # Use context handler for opening files

    # Moving imports into type-checking blocks can mess with pytest.patch()
    "TC001", # Move application import into a type-checking block
    "TC002", # Move third-party import into a type-checking block
    "TC003", # Move standard library import into a type-checking block
    "TC006", # Add quotes to type expression in typing.cast()

    "TRY003", # Avoid specifying long messages outside the exception class
    "TRY400", # Use `logging.exception` instead of `logging.error`

    "UP046", # Non PEP 695 generic class
    "UP047", # Non PEP 696 generic function
    "UP049", # Avoid private type parameter names

    # May conflict with the formatter
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q",
    "COM812",
    "COM819",

    "PLE0605",
    "FURB116",
]

[tool.ruff.lint.per-file-ignores]
# ----- Third-party code (to be extracted for HA Core submission) -----
"custom_components/esp_weaver/iot/local_ctrl/**/*.py" = ["ALL"]

# ----- Aligned with HA Core patterns -----
# Allow relative imports within components (same as HA Core)
# HA Core: "homeassistant/components/*/*/*" = ["TID252"]
"custom_components/esp_weaver/*/*" = ["TID252"]
"custom_components/esp_weaver/*/*/*" = ["TID252"]
"custom_components/esp_weaver/*/*/*/*" = ["TID252"]
"tests/*/*" = ["TID252"]
"tests/*/*/*" = ["TID252"]

# Tests: common test patterns that differ from production code
"tests/**/*.py" = [
    "S101",     # assert allowed in tests
    "S105",     # hardcoded passwords (mock data)
    "SLF001",   # private member access
    "PLR0915",  # too many statements
    "TID251",   # relative imports from conftest allowed in tests
]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
voluptuous = "vol"
"homeassistant.helpers.area_registry" = "ar"
"homeassistant.helpers.category_registry" = "cr"
"homeassistant.helpers.config_validation" = "cv"
"homeassistant.helpers.device_registry" = "dr"
"homeassistant.helpers.entity_registry" = "er"
"homeassistant.helpers.floor_registry" = "fr"
"homeassistant.helpers.issue_registry" = "ir"
"homeassistant.helpers.label_registry" = "lr"
"homeassistant.util.dt" = "dt_util"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"
"tests".msg = "You should not import tests"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.esp_weaver"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"
property-decorators = ["propcache.api.cached_property"]

# =============================================================================
# Pylint Configuration (Optional - HA Core uses ruff, not pylint)
# This is an informational check only (allow_failure: true in CI)
# =============================================================================

[tool.pylint.main]
py-version = "3.13"
# Ignore protobuf generated files and third-party local_ctrl code
ignore-patterns = [".*_pb2\\.py"]
ignore-paths = ["custom_components/esp_weaver/iot/local_ctrl"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.messages_control]
# Disable rules that conflict with HA patterns or have known pylint limitations
disable = [
    # Complexity - handled by ruff
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-branches",
    "too-many-return-statements",
    "too-many-positional-arguments",
    "too-few-public-methods",
    "too-many-ancestors",
    # HA patterns
    "duplicate-code",
    "invalid-name",              # CONFIG_SCHEMA is HA convention
    "abstract-method",           # HA uses async_* alternatives (async_turn_on, etc.)
    "import-outside-toplevel",   # HA delayed imports for circular dependency avoidance
    # Pylint limitations
    "unnecessary-ellipsis",      # Protocol definitions need ...
]

# =============================================================================
# Mypy Configuration (aligned with HA Core mypy.ini)
# Reference: https://github.com/home-assistant/core/blob/dev/mypy.ini
# =============================================================================

[tool.mypy]
python_version = "3.13"
show_error_codes = true
follow_imports = "normal"
local_partial_types = true
strict_equality = true
strict_bytes = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
enable_error_code = ["deprecated", "ignore-without-code", "redundant-self", "truthy-iterable"]
disable_error_code = ["annotation-unchecked", "import-not-found", "import-untyped"]
extra_checks = false
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true

# Third-party code exclusions (to be extracted for HA Core submission)
# NOTE: local_ctrl is ESP Provisioning library - will be extracted to separate
# PyPI package for HA Core submission
exclude = [
    "custom_components/esp_weaver/iot/local_ctrl/",
    ".venv/",
]
# Use explicit package bases to avoid duplicate module detection
explicit_package_bases = true
mypy_path = "."

# Third-party code: ESP Local Control protocol (to be extracted for HA Core submission)
# NOTE: local_ctrl is a third-party protocol library that will be extracted to a
# separate PyPI package for HA Core submission
[[tool.mypy.overrides]]
module = [
    "custom_components.esp_weaver.iot.local_ctrl.*",
]
ignore_errors = true

# Test files: relaxed typing rules (exactly as HA Core mypy.ini [mypy-tests.*])
[[tool.mypy.overrides]]
module = [
    "tests.*",
]
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
warn_return_any = false
warn_unreachable = false
