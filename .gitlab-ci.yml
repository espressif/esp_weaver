---
# GitLab CI for esp_weaver; mirrors .github/workflows/ci.yml where possible.

stages:
  - validate
  - lint
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"

cache:
  key: "python-deps-v4"
  paths:
    - .cache/pip
  # Do not cache .venv/ (too large for GitLab artifact upload). pip wheels in
  # .cache/pip are enough.

# The runner tagged `shell` is a Docker executor whose default image is
# espressif/idf (Python 3.12), so every job names the image it needs.

.python-base:
  image: python:3.13.2
  tags:
    - shell
  before_script:
    - |
      python3 -c "import sys; exit(0 if sys.version_info >= (3, 13, 2) else 1)" || \
        { echo "❌ Python 3.13.2+ required"; exit 1; }
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip wheel setuptools
    # Use legacy resolver if backtracking resolver hits resolution-too-deep
    - pip install -r requirements_test.txt || pip install --use-deprecated=legacy-resolver -r requirements_test.txt

hacs-validate:
  extends: .python-base
  stage: validate
  # Not the HACS action: that one reads the GitHub repository (description,
  # topics, issues) and runs in the GitHub workflow. This only checks the
  # files HACS needs to find in the tree.
  script:
    - |
      python3 <<'PY'
      import json
      import sys
      from pathlib import Path

      errors = []

      for f in ['hacs.json', 'README.md', 'custom_components/esp_weaver/manifest.json']:
          if not Path(f).exists():
              errors.append(f'Missing: {f}')

      if errors:
          print('❌ HACS validation FAILED:')
          for e in errors: print(f'  - {e}')
          sys.exit(1)

      try:
          with open('hacs.json') as f:
              hacs = json.load(f)
          if 'name' not in hacs:
              errors.append('hacs.json missing name')

          with open('custom_components/esp_weaver/manifest.json') as f:
              manifest = json.load(f)
          required = ['domain', 'name', 'version', 'documentation', 'codeowners',
                     'config_flow', 'iot_class', 'integration_type']
          for field in required:
              if field not in manifest:
                  errors.append(f'manifest.json missing: {field}')
      except FileNotFoundError as e:
          errors.append(f'File not found: {e.filename}')
      except json.JSONDecodeError as e:
          errors.append(f'Invalid JSON: {e}')

      if errors:
          print('❌ HACS validation FAILED:')
          for e in errors: print(f'  - {e}')
          sys.exit(1)
      print('✅ HACS validation passed')
      PY

hassfest-validate:
  stage: validate
  tags:
    - shell
  # The image home-assistant/actions/hassfest runs on GitHub: Home Assistant
  # core's script.hassfest over every integration under custom_components/.
  # Its entrypoint looks for the manifests in the working directory, so it
  # must not run when the container starts (the checkout is not there yet);
  # the script calls it once the runner has entered the checkout.
  image:
    name: ghcr.io/home-assistant/hassfest
    entrypoint: [""]
  script:
    - /usr/src/homeassistant/script/hassfest/docker/entrypoint.sh

ruff-lint:
  extends: .python-base
  stage: lint
  script:
    - ruff check custom_components/esp_weaver tests

ruff-format:
  extends: .python-base
  stage: lint
  script:
    - ruff format --check custom_components/esp_weaver tests

codespell:
  extends: .python-base
  stage: lint
  script:
    # Configured by .codespellrc; scans the whole checkout.
    - codespell
  allow_failure: false

yamllint:
  extends: .python-base
  stage: lint
  script:
    - |
      yamllint .gitlab-ci.yml .github \
        custom_components/esp_weaver/quality_scale.yaml \
        custom_components/esp_weaver/device_profiles
  allow_failure: false

profiles:
  extends: .python-base
  stage: lint
  script:
    # No device type may declare the same entity key twice. The shipped
    # Espressif profiles and the profile code copies are not compared with
    # esp-weaver-profiles in CI - the repositories merge independently;
    # maintainers run the two check tools by hand against a local checkout.
    - python tools/check_profile_keys.py
  allow_failure: false

mypy:
  extends: .python-base
  stage: lint
  script:
    # Mypy uses pyproject.toml; custom_components/esp_weaver/iot/local_ctrl is excluded.
    - mypy custom_components/esp_weaver tests --config-file=pyproject.toml
  allow_failure: false

pylint:
  extends: .python-base
  stage: lint
  script:
    - pylint custom_components/esp_weaver --rcfile=pyproject.toml
  allow_failure: false

pytest:
  extends: .python-base
  stage: test
  script:
    - |
      pytest tests/ \
        --cov=custom_components/esp_weaver \
        --cov-report=term-missing:skip-covered \
        --cov-report=xml:coverage.xml \
        --cov-report=html:htmlcov \
        --cov-fail-under=95 \
        --junitxml=report.xml \
        --durations=10 \
        -v
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - coverage.xml
      - htmlcov/
      - report.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 30 days

# hacs.json declares 2025.12.5; pins pytest-homeassistant-custom-component 0.13.301
# (2025.12.4), the last plugin on the 2025.12 line—2025.12.5 had no matching plugin.
pytest-minimum:
  extends: .python-base
  stage: test
  before_script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip wheel setuptools
    - |
      sed -E 's/^pytest-homeassistant-custom-component==.*/pytest-homeassistant-custom-component==0.13.301/' \
        requirements_test.txt > requirements_test_minimum.txt
    - pip install -r requirements_test_minimum.txt
    - python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
  script:
    - pytest tests/ -q

pytest-config-flow:
  extends: .python-base
  stage: test
  script:
    - |
      COLLECT_OUTPUT=$(pytest tests/ -k config_flow --collect-only -q 2>&1)
      COLLECTED=$(echo "$COLLECT_OUTPUT" | grep -oE '[0-9]+ test' | head -1 | grep -oE '[0-9]+' || echo "0")
      if [ "$COLLECTED" -gt 0 ]; then
        pytest tests/ -k config_flow \
          --cov=custom_components.esp_weaver.config_flow \
          --cov=custom_components.esp_weaver.flows \
          --cov-report=term-missing \
          --cov-fail-under=100 \
          -v
      else
        echo "⚠️  No config flow tests collected:"
        echo "$COLLECT_OUTPUT"
        exit 1
      fi
  allow_failure: false

# Aggregates success of all jobs listed in needs.
quality-gate:
  stage: test
  tags:
    - shell
  needs:
    - hacs-validate
    - hassfest-validate
    - ruff-lint
    - ruff-format
    - codespell
    - yamllint
    - mypy
    - pylint
    - profiles
    - pytest
    - pytest-minimum
    - pytest-config-flow
  script:
    - echo "All mandatory quality checks passed"
    - echo "Code coverage meets the 95% threshold"

push_to_github:
  stage: deploy
  rules:
    # Version tags (v1.0.0, v1.0.0-rc1, etc.) - auto push
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?($|-)/'
      when: on_success
    # master branch - auto push
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: on_success
    # release branches (release/v1.0, etc.) - auto push
    - if: '$CI_COMMIT_REF_NAME =~ /^release\/v/'
      when: on_success
    # All other cases - do not push
    - when: never
  image: python:3.13.2
  tags:
    - shell
  variables:
    GIT_STRATEGY: clone
  needs:
    - quality-gate
  before_script:
    - echo "Preparing GitHub push..."
  script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -n $GH_PUSH_KEY > ~/.ssh/id_rsa_base64
    - base64 --decode --ignore-garbage ~/.ssh/id_rsa_base64 > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host github.com\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config
    - git remote remove github &>/dev/null || true
    - git remote add github git@github.com:espressif/esp_weaver.git
    - ${CI_PROJECT_DIR}/tools/ci/push_to_github.sh
    - echo "✅ Successfully pushed to GitHub"
