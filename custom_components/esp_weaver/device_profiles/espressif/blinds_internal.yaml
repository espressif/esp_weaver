version: 1
vendor: espressif
vendor_label: "Espressif"
vendor_labels:
  zh-Hans: "乐鑫"
product: blinds_internal
product_label: "Internal blinds"
product_labels:
  zh-Hans: "内置百叶窗"
model: "*"

devices:
  - type: esp.device.blinds-internal
    entities:
      - platform: cover
        name: "Internal Blinds"
        key: internal_blinds
        device_class: blind
        attributes:
          position:
            param: "Blinds Position"
            type: esp.param.blinds-position
            data_type: int
            ui_type: esp.ui.slider
            properties: [read, write]
            bounds: { min: 0, max: 100, step: 1 }
