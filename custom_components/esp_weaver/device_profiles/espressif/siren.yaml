version: 1
vendor: espressif
vendor_label: "Espressif"
vendor_labels:
  zh-Hans: "乐鑫"
product: siren
product_label: "Siren"
product_labels:
  zh-Hans: "警报器"
model: "*"

devices:
  # RainMaker has no standard siren type. This extended type provides basic
  # power control without assuming vendor-specific tone or duration parameters.
  - type: esp.device.siren
    entities:
      - platform: siren
        name: "Siren"
        key: siren
        attributes:
          state:
            param: "Power"
            type: esp.param.power
            data_type: bool
            ui_type: esp.ui.toggle
            properties: [read, write]
