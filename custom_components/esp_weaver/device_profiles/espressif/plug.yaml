version: 1
vendor: espressif
vendor_label: "Espressif"
vendor_labels:
  zh-Hans: "乐鑫"
product: plug
product_label: "Plug"
product_labels:
  zh-Hans: "插头"
model: "*"

devices:
  - type: esp.device.plug
    entities:
      - platform: switch
        name: "Plug"
        key: plug
        device_class: outlet
        attributes:
          state:
            param: "Power"
            type: esp.param.power
            data_type: bool
            ui_type: esp.ui.toggle
            properties: [read, write]
